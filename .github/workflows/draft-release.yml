name: draft-release

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      # Inlined replacement for ctag-fh-kiel/esp-idf-action@strampler.
      # That action swaps IDF onto the ctag idf4_1-strampler branch but never
      # reinstalls the tools for that revision, so export.sh aborts with
      # "tool openocd-esp32 has no installed versions". Running install.sh
      # after the checkout fixes it.
      - name: Build binaries
        run: |
          docker run --rm -v "$PWD":/project -w /project espressif/idf:release-v4.1 bash -c '
            set -e
            git config --global --add safe.directory "*" || true
            cd $IDF_PATH
            git remote add ctag https://github.com/ctag-fh-kiel/esp-idf.git
            git fetch ctag
            git checkout ctag/idf4_1-strampler
            git submodule update --init --recursive
            ./install.sh
            . ./export.sh
            cd /project
            idf.py build
          '
      - name: Collect binaries
        run: |
          sudo chown -R "$USER" build
          mkdir -p artifacts
          cp build/ctag-straempler.bin \
             build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin \
             artifacts/
          ls -l artifacts
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: straempler-binaries
          path: artifacts/*.bin
          if-no-files-found: error
